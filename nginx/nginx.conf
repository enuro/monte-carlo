server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Frontend — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy → Rust backend
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Monte Carlo с 10M сэмплов может считаться долго
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        # Размер тела запроса (координаты фигур)
        client_max_body_size 2M;
    }

    # Кэшировать статику агрессивно (Vite добавляет хэши в имена файлов)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html не кэшируем
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
