services:

  backend:
    build:
      context: ./backend
    environment:
      - BACKEND_PORT=8841
    ports:
      - "8841:8841"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -sf -X POST http://localhost:$$BACKEND_PORT/api/calculate -H 'Content-Type: application/json' -d '{\"shape\":{\"type\":\"preset\",\"preset\":{\"kind\":\"circle\",\"params\":{\"radius\":1,\"cx\":0,\"cy\":0}},\"bounding_box\":{\"x_min\":-2,\"x_max\":2,\"y_min\":-2,\"y_max\":2}},\"rng\":{\"type\":\"lcg\",\"seed\":42},\"samples\":100}' > /dev/null || exit 1"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "3000:811"
    restart: unless-stopped
